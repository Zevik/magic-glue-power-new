<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#140a3a">
    <meta name="description" content="מסע אינטראקטיבי אל העולם הנסתר של הגולות והכוח הנעלם שמחזיק את כל מה שסביבנו. לילדים ולמבוגרים סקרנים.">
    <title>הכוח הנעלם: מסע לעולם הגולות</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Secular+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- The living background: colour worlds that blend into each other between pages. Painted by js/lib/ambient.js -->
    <canvas id="ambient" aria-hidden="true"></canvas>

    <!-- One dot per page; each is a link to that page. Filled in by js/main.js -->
    <nav id="progress" aria-label="התקדמות במסע"></nav>

    <button id="sound-btn" type="button" class="chrome-btn" aria-label="צליל" aria-pressed="true"></button>
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- Each page of the journey is mounted here by js/main.js, at its own #/slug address -->
    <div id="app-container"></div>

    <noscript><p style="padding:2rem;text-align:center;color:#fff">האתר הזה צריך JavaScript כדי לעבוד.</p></noscript>
    <script type="module" src="js/main.js"></script>
</body>
</html>
